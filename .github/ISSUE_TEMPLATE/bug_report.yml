name: Bug report
description: Something doesn't work (install, server, bot or dashboard)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Before posting, remove anything private from logs: your username if you want, IPs, and never paste `run/rcon_*.txt` or `mindcraft/keys.json`.
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Installer (install.ps1 / FelixIAMinecraft.bat)
        - Minecraft server (Paper)
        - Bot (Mindcraft / LLM)
        - Dashboard
        - Minecraft client / Prism instance
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: I clicked "Collect wood" and the bot said ... I expected it to ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run scripts\start_all.ps1
        2. ...
  - type: textarea
    id: status
    attributes:
      label: Output of scripts\status.ps1
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: The last lines of the matching file in `logs\` (bot_stdout.log, bot_stderr.log, server_main_stdout.log, dashboard_stdout.log).
      render: text
  - type: input
    id: hardware
    attributes:
      label: Windows version, GPU and VRAM, RAM
      placeholder: Windows 11 24H2, RTX 3060 12 GB, 32 GB RAM
    validations:
      required: true
