name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly: re-download everything to catch dead links or changed files
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Syntax and config
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: PowerShell scripts parse and are ASCII-only
        shell: powershell   # Windows PowerShell 5.1, the one users run
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1 -File | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
            # PowerShell 5.1 reads UTF-8 files without a BOM as ANSI, so any non-ASCII byte can break parsing.
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            $i = [Array]::FindIndex($bytes, [Predicate[byte]]{ param($b) $b -gt 127 })
            if ($i -ge 0) { Write-Host "::error file=$($_.FullName)::non-ASCII byte at offset $i"; $bad++ }
          }
          if ($bad) { exit 1 }

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: JavaScript syntax
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for f in dashboard/*.mjs scripts/*.js scripts/*.mjs mindcraft/tools/*.js mindcraft/settings.js mindcraft/src/utils/mcdata.js mindcraft/src/agent/library/full_state.js .github/scripts/*.mjs; do
            echo "node --check $f"; node --check "$f"
          done

      - name: JSON config is valid
        shell: bash
        run: |
          for f in config/*.json scripts/downloads.json mindcraft/profiles/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      - name: Batch files use CRLF
        shell: bash
        run: |
          for f in *.bat; do
            # Byte check in node: Git Bash's grep drops the CR before matching.
            node -e "process.exit(/(^|[^\r])\n/.test(require('fs').readFileSync(process.argv[1], 'latin1')) ? 1 : 0)" "$f" \
              || { echo "::error file=$f::LF line endings (cmd.exe needs CRLF)"; exit 1; }
          done

  downloads:
    name: downloads.json hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Check format and verify small downloads
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: node .github/scripts/check_downloads.mjs
      - name: Verify every download
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node .github/scripts/check_downloads.mjs --all
